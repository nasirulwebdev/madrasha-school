{% extends 'base.html' %}

{% block title %}Update Photo{% endblock %}

{% block content %}
<div class="container my-4">
    <h2>Update Photo</h2>

    <!-- Update Form -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update</button>
    </form>

    <hr>

    <!-- Current Photo + Description -->
    {% if photo.image %}
        <h4>Current Photo:</h4>
        <img src="{{ photo.image.url }}" alt="{{ photo.title }}" style="max-width:300px;" class="img-fluid mb-2">
        <p><strong>Description:</strong> {{ photo.description }}</p>
    {% endif %}
</div>
{% endblock %}
