{% extends 'base.html' %}
{% block title %}Video Detail{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>{{ video.title }}</h2>
    <video class="img-fluid rounded shadow-sm mb-3" controls style="max-height:500px; width:100%;">
        <source src="{{ video.video.url }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <p><small class="text-muted">Uploaded on {{ video.created_at|date:"d M Y H:i" }}</small></p>

    <div class="d-flex gap-2">
        <a href="{% url 'gallery:video_update' video.id %}" class="btn btn-warning">Update</a>
        <a href="{% url 'gallery:video_delete' video.id %}" class="btn btn-danger">Delete</a>
        <a href="{% url 'gallery:gallery_home' %}" class="btn btn-secondary">Back to Gallery</a>
    </div>
</div>
{% endblock %}
