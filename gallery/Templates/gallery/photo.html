{% extends 'base.html' %}

{% block title %}Photo Gallery{% endblock %}

{% block content %}
<h1 class="mb-4">Photo Gallery</h1>

{% if photos %}
<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for photo in photos %}
    <div class="col">
        <div class="card h-100">
            <img src="{{ photo.image.url }}" class="card-img-top" alt="{{ photo.title }}">
            <div class="card-body">
                <h5 class="card-title">{{ photo.title }}</h5>
                <p class="card-text">Uploaded on {{ photo.created_at|date:"d M Y" }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="alert alert-info">No photos uploaded yet.</p>
{% endif %}

{% endblock %}
