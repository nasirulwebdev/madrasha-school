{% extends 'base.html' %}

{% block title %}Photo List{% endblock %}

{% block content %}
<div class="container my-4">
    <h2>All Photos</h2>

    {% for photo in photos %}
        <div class="card mb-3" style="max-width: 400px;">
            {% if photo.image %}
                <img src="{{ photo.image.url }}" class="card-img-top" alt="{{ photo.title }}">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ photo.title }}</h5>
                <p class="card-text">{{ photo.description }}</p>
                <a href="{% url 'gallery:photo_update' photo.id %}" class="btn btn-primary">Edit</a>
            </div>
        </div>
    {% empty %}
        <p>No photos found.</p>
    {% endfor %}
</div>
{% endblock %}
