{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4 text-danger">Delete Academic</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'academic:academic_admin' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
